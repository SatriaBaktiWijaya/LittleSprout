<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="16" y1="14" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="0" y="2" width="64" height="64" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f5132" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle / circle badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- LittleSprout Sprout Group with subtle drop shadow -->
  <g filter="url(#shadow)">
    <!-- Stem -->
    <path d="M32 46 C32 38, 30 29, 29 25" stroke="url(#leafGrad)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Left Leaf -->
    <path d="M29 28 C21 28, 14 23, 14 17 C20 16, 27 19, 29 26 Z" fill="url(#leafGrad)"/>
    
    <!-- Right Leaf (larger, uplifting) -->
    <path d="M30 25 C34 16, 44 14, 50 16 C51 24, 43 30, 31 27 Z" fill="url(#leafGrad)"/>

    <!-- Tiny cheerful golden sun speck / dewdrop -->
    <circle cx="43" cy="13" r="2.5" fill="#fef08a"/>
  </g>
</svg>